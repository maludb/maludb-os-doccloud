# DocCloud — an application from us beside the Business OS kernel. Rendered by the kernel's installer (bin/app_install.php):
# {{APP_FQDN}} = doccloud.<domain>, {{APP_DIR}} = /srv/apps/doccloud, the ports from config/.env.
# Two virtual hosts: the public name for people (and the proxied MCP servers, the key-checked documents API and the two
# token doors /s/ and /r/), and a loopback port for the kernel's actions server and approval replays.
#
# Uploads travel in PARTS of 8 MB (design §6.1, D9): the per-request ceilings below are for one part, or for the API's
# one-request upload of up to 64 MB. The per-file ceiling (2 GB by default) is a setting, never Apache's.
# storage/ (the blobs, the parts, the thumbnails, the exports) is NEVER under the web root: the gate serves every byte.

<VirtualHost *:80>
	ServerName {{APP_FQDN}}
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/doccloud-error.log
	CustomLog ${APACHE_LOG_DIR}/doccloud-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on
	LimitRequestBody 73400320
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
	</IfModule>

	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		# One part of an upload, or the API's one-request upload (64 MB); the assembling request may take a while.
		php_admin_value upload_max_filesize 64M
		php_admin_value post_max_size 72M
		php_admin_value max_execution_time 300
		php_admin_value memory_limit 256M
	</Directory>

	# The two read MCP servers, under the application's name. Host is NOT preserved (the SDK's DNS-rebinding guard checks it
	# against loopback). Bearer auth is the servers' own (a person's token, the tenant's run token, or the kernel's).
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp

	RewriteEngine On
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]

	# The public allow-list under /api/v1/: the health check and the documents API (bearer = a person's key, acting as them;
	# rate-limited and logged by the route). Nothing else answers under /api — in particular not /api/v1/shares/read.php, the K7 door
	# the records server calls over loopback on the internal port below.
	#   GET /api/v1/me  /libraries  /folders/{id}  /documents/{id}[/download|/text]   POST /api/v1/folders  /upload  /search  /graph/find  /links
	#   PATCH|DELETE /api/v1/documents/{id}   PUT /api/v1/documents/{id}/tags   POST /api/v1/upload/start  /upload/{session}/finish   PUT /api/v1/upload/{session}/{n}
	# And the signed download of the K7 share document_link: /x/{document}/{version}/{expires}/{consumer}/{signature} (no session; the signature and ten minutes are the authority).
	SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/api/v1/(me|libraries|search|links|folders|upload)/?$ /api/v1/$1.php [L,QSA]
	RewriteRule ^/api/v1/folders/([0-9]+)/?$ /api/v1/folders.php?id=$1 [L,QSA]
	RewriteRule ^/api/v1/documents/([0-9]+)/?$ /api/v1/documents.php?id=$1 [L,QSA]
	RewriteRule ^/api/v1/documents/([0-9]+)/(download|text|tags)/?$ /api/v1/documents.php?id=$1&do=$2 [L,QSA]
	RewriteRule ^/api/v1/upload/start/?$ /api/v1/upload/start.php [L,QSA]
	RewriteRule ^/api/v1/upload/([0-9]+)/finish/?$ /api/v1/upload/finish.php?session=$1 [L,QSA]
	RewriteRule ^/api/v1/upload/([0-9]+)/([0-9]+)/?$ /api/v1/upload/part.php?session=$1&n=$2 [L,QSA]
	RewriteRule ^/api/v1/graph/find/?$ /api/v1/graph/find.php [L,QSA]
	RewriteRule ^/api/ - [R=404,L]
	# The bridge (the records MCP server's signed loopback door to the graph, the search log and the K7 shares) exists on the internal port ONLY: this name answers 404.
	RewriteRule ^/internal(/|$) - [R=404,L]
	RewriteRule ^/x/[0-9]+/[0-9]+/[0-9]+/[a-z][a-z0-9_]*/[a-f0-9]{64}$ /x/index.php [L]

	# The sign-on receivers.
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]

	# The two token doors (design §4; auth_kind none, the token in the path is the authority): a shared link, a file request.
	RewriteRule ^/s/([a-f0-9]{48})(/.*)?$ /s/index.php?token=$1&rest=$2 [L,QSA]
	RewriteRule ^/r/([a-f0-9]{48})(/.*)?$ /r/index.php?token=$1&rest=$2 [L,QSA]

	# The gated document door (a session, or a signed ten-minute URL from document_link): the current version, one version,
	# a thumbnail, an export. Range requests are honoured by the handler.
	RewriteRule ^/d/([0-9]+)$ /d/index.php?id=$1 [L,QSA]
	RewriteRule ^/d/([0-9]+)/v/([0-9]+)$ /d/index.php?id=$1&v=$2 [L,QSA]
	RewriteRule ^/d/([0-9]+)/thumb$ /d/thumb.php?id=$1 [L,QSA]
	RewriteRule ^/f/([0-9]+)$ /f/index.php?id=$1 [L,QSA]
	RewriteRule ^/f/([0-9]+)/([a-z_-]+)$ /f/$2.php?id=$1 [L,QSA]
	RewriteRule ^/d/([0-9]+)/([a-z_-]+)$ /d/$2.php?id=$1 [L,QSA]
	RewriteRule ^/exports/([0-9]+)$ /exports/download.php?id=$1 [L,QSA]

	# The upload parts (session, CSRF): start, part, finish.
	RewriteRule ^/upload/(start|part|finish)$ /upload/$1.php [L,QSA]

	# Screens outside the canonical shape (the manifest, Phase 1): a page of a record (/groups/12/members).
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]

	# Canonical URLs (the action manifest, Phase 1): /x/new -> form.php, /x/{id}/edit -> form.php?id=, /x/{id} -> view.php?id=.
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>

# PHP on the internal port, for the kernel's actions server and approval replays only.
Listen 127.0.0.1:{{APP_INTERNAL_PORT}}
<VirtualHost 127.0.0.1:{{APP_INTERNAL_PORT}}>
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/doccloud-error.log
	CustomLog ${APACHE_LOG_DIR}/doccloud-access.log combined
	LimitRequestBody 73400320
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
	</IfModule>
	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		php_admin_value upload_max_filesize 64M
		php_admin_value post_max_size 72M
		php_admin_value max_execution_time 300
		php_admin_value memory_limit 256M
	</Directory>
	RewriteEngine On
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/d/([0-9]+)$ /d/index.php?id=$1 [L,QSA]
	RewriteRule ^/d/([0-9]+)/v/([0-9]+)$ /d/index.php?id=$1&v=$2 [L,QSA]
	RewriteRule ^/d/([0-9]+)/([a-z_-]+)$ /d/$2.php?id=$1 [L,QSA]
	RewriteRule ^/f/([0-9]+)$ /f/index.php?id=$1 [L,QSA]
	RewriteRule ^/f/([0-9]+)/([a-z_-]+)$ /f/$2.php?id=$1 [L,QSA]
	RewriteRule ^/upload/(start|part|finish)$ /upload/$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
